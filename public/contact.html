<main><section class="sec"><div class="wrap"><h1 data-i18n="ct.h1"></h1><p class="lead" data-i18n="ct.sub"></p><div class="calc" style="margin-top:28px"><div class="card"><form id="cf"><label data-i18n="field.name"></label><input id="c_n" required><label data-i18n="field.email"></label><input type="email" id="c_e" required><label data-i18n="ct.topic"></label><select id="c_t"><option value="general" data-i18n-opt="ct.t1"></option><option value="claims" data-i18n-opt="ct.t2"></option><option value="business" data-i18n-opt="ct.t3"></option><option value="partnerships" data-i18n-opt="ct.t4"></option><option value="press" data-i18n-opt="ct.t5"></option></select><label data-i18n="field.message"></label><textarea id="c_m" rows="5" required></textarea><p style="color:var(--mute);font-size:.85rem;margin:8px 0 0" data-i18n="ct.ack"></p><div class="msg" id="cm"></div><button class="btn" style="margin-top:14px" data-i18n="ct.send"></button></form></div>
