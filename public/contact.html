<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | PulseCover</title><meta name="description" content="Get in touch with the PulseCover team.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"></head><body>
<main><section class="sec"><div class="wrap"><h1 data-i18n="ct.h1"></h1><p class="lead" data-i18n="ct.sub"></p><div class="calc" style="margin-top:28px"><div class="card"><form id="cf"><label data-i18n="field.name"></label><input id="c_n" required><label data-i18n="field.email"></label><input type="email" id="c_e" required><label data-i18n="ct.topic"></label><select id="c_t"><option value="general" data-i18n-opt="ct.t1"></option><option value="claims" data-i18n-opt="ct.t2"></option><option value="business" data-i18n-opt="ct.t3"></option><option value="partnerships" data-i18n-opt="ct.t4"></option><option value="press" data-i18n-opt="ct.t5"></option></select><label data-i18n="field.message"></label><textarea id="c_m" rows="5" required></textarea><div class="msg" id="cm"></div><button class="btn" style="margin-top:14px" data-i18n="ct.send"></button></form></div>
<div class="card"><h3 data-i18n="ct.details"></h3><p>hello@pulsecover.example</p><p>+60 3-0000 0000</p><p data-i18n="ct.address"></p><p>Instagram &middot; TikTok &middot; LinkedIn</p></div></div></div></section></main><script src="/js/i18n.js"></script><script src="/js/i18n2.js"></script><script src="/js/app.js"></script><script>
cf.onsubmit=async e=>{e.preventDefault();try{await PC.api('/contact',{name:c_n.value,email:c_e.value,topic:c_t.value,message:c_m.value});PC.msg(cm,PC.t('ct.ok'),true);cf.reset()}catch(x){PC.msg(cm,x.message)}}</script></body></html>
