<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family invite | PulseCover</title><meta name="description" content="Accept or decline an invite to a PulseCover family plan.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<script>(function(){try{var th=localStorage.getItem('pc_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=th}catch(e){document.documentElement.dataset.theme='light'}})()</script><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#B71234"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PulseCover"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png"><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/appmode.css"><script>(function(){var d=document.documentElement,m=function(){var on=false;try{on=matchMedia('(max-width:820px)').matches||(matchMedia('(display-mode: standalone)').matches&&matchMedia('(pointer:coarse)').matches)||(navigator.standalone===true)}catch(e){}d.classList.toggle('appmode',on)};m();addEventListener('resize',m);try{if(location.pathname==='/'&&!/[?&]site=1/.test(location.search)&&matchMedia('(max-width:820px)').matches&&matchMedia('(pointer:coarse)').matches&&!sessionStorage.getItem('pc_site')){location.replace('/m/')}else if(/[?&]site=1/.test(location.search)){sessionStorage.setItem('pc_site','1')}}catch(e){}})()</script></head><body>
<main><section class="sec"><div class="wrap" style="max-width:560px"><div class="card" id="iv_box" aria-live="polite"><p data-i18n="iv.loading"></p></div></div></section></main><script src="/js/i18n.js"></script><script src="/js/i18n2.js"></script><script src="/js/i18n3.js"></script><script src="/js/i18n4.js"></script><script src="/js/i18n5.js"></script><script src="/js/i18n6.js"></script><script src="/js/i18n7.js"></script><script src="/js/i18n8.js"></script><script src="/js/i18n9.js"></script><script src="/js/i18n10.js"></script><script src="/js/i18n11.js"></script><script src="/js/icons.js"></script><script src="/js/pricing-config.js"></script><script src="/js/app.js"></script><script src="/js/subscription.js"></script><script src="/js/ui.js"></script><script src="/js/pwa.js"></script><script src="/js/appmode.js"></script><script>
(function(){
 const parts=location.pathname.split('/').filter(Boolean),token=parts[1]||'',wantDecline=/[?&]decline=1/.test(location.search);
 const box=document.getElementById('iv_box'),T=(k,o)=>{let s=PC.t(k);if(o)for(const x in o)s=s.split('{'+x+'}').join(o[x]);return s};
 let info=null,state='load',err='';
 const fdate=(iso)=>new Date(iso).toLocaleDateString(PC.lang==='zh'?'zh-CN':PC.lang==='ms'?'ms-MY':PC.lang==='ta'?'ta-IN':'en-MY',{day:'numeric',month:'long',year:'numeric'});
 function draw(){
  if(state==='load'){box.innerHTML='<p>'+T('iv.loading')+'</p>';return}
  if(state==='bad'){const k=info&&info.reason==='expired'?'iv.bad.expired':info&&info.reason==='invalid'?'iv.bad.invalid':'iv.bad.used';box.innerHTML='<h2>'+T('iv.bad.h')+'</h2><p>'+T(k)+'</p><div class="cta"><a class="btn" href="/">'+T('iv.home')+'</a></div>';return}
  if(state==='ok'){box.innerHTML='<div class="sb-okic" aria-hidden="true">&#10003;</div><h2>'+T('iv.ok.h')+'</h2><p>'+T('iv.ok.p')+'</p><div class="cta"><a class="btn" href="/connect">'+T('iv.ok.link')+'</a><a class="btn ghost" href="/dashboard">'+T('iv.ok.dash')+'</a></div>';return}
  if(state==='declined'){box.innerHTML='<h2>'+T('iv.dec.h')+'</h2><p>'+T('iv.dec.p')+'</p><div class="cta"><a class="btn" href="/">'+T('iv.home')+'</a></div>';return}
  const rel=T('fm.rel.'+info.relationship).toLowerCase();
  box.innerHTML='<h2 style="margin-top:0">'+T('iv.h',{n:PC.esc(info.inviter)})+'</h2><p>'+T('iv.rel',{r:PC.esc(rel)})+'</p><p>'+T('iv.what')+'</p><div class="pqr-banner" style="margin:14px 0"><p><b>'+T('iv.share')+'</b></p></div>'+
   (PC.user?'':'<p class="fnote">'+T('iv.signin')+'</p>')+(err?'<div class="msg err">'+PC.esc(err)+'</div>':'')+
   '<div class="cta">'+(PC.user?'<button class="btn" id="iv_ok"'+(wantDecline?' style="opacity:.85"':'')+'>'+T('iv.accept')+'</button>':'<a class="btn" href="/account?next='+encodeURIComponent('/invite/'+token)+'">'+T('iv.login')+' / '+T('iv.signup')+'</a>')+'<button class="btn ghost" id="iv_no">'+T('iv.decline')+'</button></div><p class="fnote" style="margin-top:14px">'+T('iv.expires',{d:fdate(info.expiresAt)})+'</p>';
  const ok=document.getElementById('iv_ok'),no=document.getElementById('iv_no');
  if(ok)ok.onclick=async()=>{ok.disabled=true;err='';try{await PC.api('/invite/accept',{token});state='ok'}catch(e){err=e.message||T('iv.err')}draw()};
  no.onclick=async()=>{no.disabled=true;err='';try{await PC.api('/invite/decline',{token});state='declined'}catch(e){err=e.message||T('iv.err')}draw()};
  if(wantDecline){no.focus()}
 }
 PC.ready.then(async()=>{try{info=await PC.api('/invite/info',{token});state=info.valid?'ready':'bad'}catch(e){info={reason:'invalid'};state='bad'}draw()});
 window.addEventListener('pc:lang',draw);
})();</script></body></html>
