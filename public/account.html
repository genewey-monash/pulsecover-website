<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Account | PulseCover</title><meta name="description" content="Log in or create your PulseCover account.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<script>(function(){try{var th=localStorage.getItem('pc_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=th}catch(e){document.documentElement.dataset.theme='light'}})()</script><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#B71234"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PulseCover"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png"><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/appmode.css"><script>(function(){var d=document.documentElement,m=function(){var on=false;try{on=matchMedia('(max-width:820px)').matches||(matchMedia('(display-mode: standalone)').matches&&matchMedia('(pointer:coarse)').matches)||(navigator.standalone===true)}catch(e){}d.classList.toggle('appmode',on)};m();addEventListener('resize',m);try{if(location.pathname==='/'&&!/[?&]site=1/.test(location.search)&&matchMedia('(max-width:820px)').matches&&matchMedia('(pointer:coarse)').matches&&!sessionStorage.getItem('pc_site')){location.replace('/m/')}else if(/[?&]site=1/.test(location.search)){sessionStorage.setItem('pc_site','1')}}catch(e){}})()</script></head><body>
<main><section class="sec"><div class="wrap" style="max-width:540px"><h1 data-i18n="acc.h1"></h1><p class="lead" data-i18n="acc.sub"></p>
<div class="card" id="loginbox"><h3 data-i18n="acc.login"></h3><form id="lf" novalidate>
 <label data-i18n="field.email" for="le"></label><input type="email" id="le" required autocomplete="email" inputmode="email"><p class="fhelp" id="le_e"></p>
 <label data-i18n="field.password.login" for="lp"></label><div class="pwwrap"><input type="password" id="lp" required autocomplete="current-password" minlength="8"><button type="button" class="pwtog" data-for="lp" data-i18n="acc.show"></button></div><p class="fhelp" id="lp_e"></p>
 <div id="lm" class="msg"></div><button class="btn" style="margin-top:18px;width:100%" data-i18n="acc.login"></button></form>
 <p style="margin:18px 0 0"><span data-i18n="acc.new"></span> <a href="#" id="toreg" data-i18n="acc.register"></a></p></div>
<div class="card" id="regbox" style="display:none"><h3 data-i18n="acc.register"></h3><p style="color:var(--mute);font-size:.92rem" data-i18n="acc.register.sub"></p><form id="rf" novalidate>
 <label data-i18n="field.name" for="rn"></label><input id="rn" required autocomplete="name" maxlength="100"><p class="fhelp" id="rn_e"></p>
 <label data-i18n="field.email" for="re"></label><input type="email" id="re" required autocomplete="email" inputmode="email"><p class="fhelp" id="re_e"></p>
 <label data-i18n="field.dob" for="rd"></label><input type="date" id="rd" required><p class="fhelp" id="rd_e"></p>
 <label data-i18n="field.password" for="rp"></label><div class="pwwrap"><input type="password" id="rp" required autocomplete="new-password" minlength="8"><button type="button" class="pwtog" data-for="rp" data-i18n="acc.show"></button></div><p class="fhelp" id="rp_e"></p><div class="pwmeter"><i id="rmeter"></i></div><p style="font-size:.8rem;color:var(--mute);margin:6px 0 0" id="rstrength"></p>
 <label data-i18n="field.password2" for="rp2"></label><div class="pwwrap"><input type="password" id="rp2" required autocomplete="new-password" minlength="8"><button type="button" class="pwtog" data-for="rp2" data-i18n="acc.show"></button></div><p class="fhelp" id="rp2_e"></p>
 <label data-i18n="field.referral" for="rr"></label><input id="rr" autocomplete="off" maxlength="20">
 <p style="font-size:.85rem;color:var(--mute);margin:14px 0 0" data-i18n="acc.welcome.note"></p>
 <div id="rm" class="msg"></div><button class="btn" style="margin-top:18px;width:100%" data-i18n="acc.register"></button></form>
 <p style="margin:18px 0 0"><span data-i18n="acc.have"></span> <a href="#" id="tolog" data-i18n="acc.login"></a></p></div>
<div class="card" id="okbox" style="display:none;text-align:center"><div class="ico" style="margin:0 auto 14px">&#10003;</div><h3 data-i18n="acc.created"></h3><p id="okmail" style="margin:0"></p></div>
</div></section></main><script src="/js/i18n.js"></script><script src="/js/i18n2.js"></script><script src="/js/i18n3.js"></script><script src="/js/i18n4.js"></script><script src="/js/i18n5.js"></script><script src="/js/icons.js"></script><script src="/js/app.js"></script><script src="/js/ui.js"></script><script src="/js/pwa.js"></script><script src="/js/appmode.js"></script><script>
const q=new URLSearchParams(location.search);const next=q.get('next')&&q.get('next').startsWith('/')?q.get('next'):'/dashboard';
const EMAIL=/^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[A-Za-z]{2,}$/;
function bad(id,key){const i=document.getElementById(id),h=document.getElementById(id+'_e');if(key){i.classList.add('fld-err');h.textContent=PC.t(key);h.classList.add('on')}else{i.classList.remove('fld-err');h.classList.remove('on')}return !key}
if(q.get('ref')){document.getElementById('rr').value=q.get('ref');show(true)}
function show(r){document.getElementById('loginbox').style.display=r?'none':'';document.getElementById('regbox').style.display=r?'':'none'}
document.getElementById('toreg').onclick=e=>{e.preventDefault();show(true)};document.getElementById('tolog').onclick=e=>{e.preventDefault();show(false)};
document.getElementById('rd').max=new Date(new Date().getFullYear()-18,new Date().getMonth(),new Date().getDate()).toISOString().slice(0,10);
document.querySelectorAll('.pwtog').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.for);const s=i.type==='password';i.type=s?'text':'password';b.textContent=PC.t(s?'acc.hide':'acc.show')});
window.addEventListener('pc:lang',()=>document.querySelectorAll('.pwtog').forEach(b=>b.textContent=PC.t(document.getElementById(b.dataset.for).type==='password'?'acc.show':'acc.hide')));
function strength(v){let s=0;if(v.length>=8)s++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v)||v.length>=14)s++;return v.length<8?0:Math.max(1,s)}
rp.oninput=()=>{const s=strength(rp.value),m=document.getElementById('rmeter');m.style.width=(rp.value?[12,30,55,80,100][s]:0)+'%';m.style.background=['#c92a2a','#e8590c','#d99a06','#2b9348','#1c7a3c'][s];document.getElementById('rstrength').textContent=rp.value?PC.t('acc.pw.'+s):'';document.getElementById('rstrength').style.color=['#C92A2A','#C2410C','#9A6B00','#2B9348','#1C7A3C'][s];if(rp.value.length>=8&&document.getElementById('rp_e').classList.contains('on'))bad('rp',null);if(rp2.value)bad('rp2',rp.value===rp2.value?null:'acc.err.match')};
rp.onblur=()=>rp.value&&bad('rp',rp.value.length>=8?null:'acc.err.pwlen');
rp2.oninput=()=>bad('rp2',rp.value===rp2.value?null:'acc.err.match');
re.onblur=()=>re.value&&bad('re',EMAIL.test(re.value.trim())?null:'acc.err.email');le.onblur=()=>le.value&&bad('le',EMAIL.test(le.value.trim())?null:'acc.err.email');
PC.ready.then(()=>{if(PC.user)location.href=next;if(q.get('expired')){const m=document.getElementById('lm');PC.msg(m,PC.t('idle.out'));window.addEventListener('pc:lang',()=>PC.msg(m,PC.t('idle.out')))}});
function srv(m){m=m||'';if(/no account found/i.test(m))return PC.t('acc.err.noacct');if(/already exists/i.test(m))return PC.t('acc.err.exists');if(/incorrect/i.test(m))return PC.t('acc.err.login');if(/invalid email/i.test(m))return PC.t('acc.err.email');if(/do not match/i.test(m))return PC.t('acc.err.match');if(/at least 18/i.test(m))return PC.t('acc.err.dob');return m}
document.getElementById('lf').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('lm');m.className='msg';
 const ok=bad('le',EMAIL.test(le.value.trim())?null:'acc.err.email')&bad('lp',lp.value?null:'acc.err.pwlen');if(!ok){const f=document.querySelector('#lf .fld-err');if(f)f.focus();const h=document.querySelector('#lf .fhelp.on');if(h)PC.msg(m,h.textContent);return}
 try{await PC.api('/login',{email:le.value.trim(),password:lp.value});location.href=next}catch(x){PC.msg(m,srv(x.message))}};
document.getElementById('rf').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('rm');m.className='msg';
 const age=(d=>{const t=new Date(),b=new Date(d);let a=t.getFullYear()-b.getFullYear();const md=t.getMonth()-b.getMonth();if(md<0||(md===0&&t.getDate()<b.getDate()))a--;return a})(rd.value);
 const ok=[bad('rn',rn.value.trim().length>=2?null:'acc.err.name'),bad('re',EMAIL.test(re.value.trim())?null:'acc.err.email'),bad('rd',rd.value&&age>=18?null:'acc.err.dob'),bad('rp',rp.value.length>=8?null:'acc.err.pwlen'),bad('rp2',rp.value===rp2.value?null:'acc.err.match')].every(Boolean);
 if(!ok){if(rp.value!==rp2.value)rp2.value='';const f=document.querySelector('#rf .fld-err');if(f){f.scrollIntoView({block:'center',behavior:'smooth'});f.focus({preventScroll:true})}const h=document.querySelector('#rf .fhelp.on');if(h)PC.msg(m,h.textContent);return}
 const b=e.target.querySelector('button.btn');b.disabled=true;
 try{await PC.api('/register',{name:rn.value.trim(),email:re.value.trim(),dob:rd.value,password:rp.value,password2:rp2.value,referral:rr.value,lang:PC.lang});
  document.getElementById('regbox').style.display='none';document.getElementById('okbox').style.display='';document.getElementById('okmail').textContent=PC.t('acc.created.p')+' '+re.value.trim();setTimeout(()=>location.href=next,2600)}
 catch(x){PC.msg(m,srv(x.message));b.disabled=false}};</script></body></html>
