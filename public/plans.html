<script>(function(){try{var th=localStorage.getItem('pc_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=th}catch(e){document.documentElement.dataset.theme='light'}})()</script><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#B71234"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PulseCover"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png"><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/appmode.css"><script>(function(){var d=document.documentElement,m=function(){var on=false;try{on=matchMedia('(max-width:820px)').matches||(matchMedia('(display-mode: standalone)').matches&&matchMedia('(pointer:coarse)').matches)||(navigator.standalone===true)}catch(e){}d.classList.toggle('appmode',on)};m();addEventListener('resize',m);try{if(location.pathname==='/'&&!/[?&]site=1/.test(location.search)&&matchMedia('(max-width:820px)').matches&&matchMedia('(pointer:coarse)').matches&&!sessionStorage.getItem('pc_site')){location.replace('/m/')}else if(/[?&]site=1/.test(location.search)){sessionStorage.setItem('pc_site','1')}}catch(e){}})()</script></head><body>
<main>
<section class="sec" style="padding:48px 0 28px"><div class="wrap"><div class="cards c2" style="align-items:center"><div><h1 data-i18n="plans.h1"></h1><p class="lead" data-i18n="plans.sub"></p><div class="cta"><a class="btn" href="/calculator" data-i18n="plan.quote"></a><a class="btn ghost" href="#advisor" data-open-callback data-i18n="nav.talk"></a></div></div><img class="photo" style="min-height:0;height:260px" src="/img/three-ages.jpg" alt="Three friends looking at a phone together at a café" width="1200" height="896" loading="lazy"></div></div></section>
<div class="subnav"><div class="wrap"><strong data-i18n="nav.plans"></strong><a href="#list" data-i18n="plans.all"></a><a href="#compare" data-i18n="cmpt.h"></a><a href="/how-pricing-works" data-i18n="nav.how"></a><a href="/faq" data-i18n="nav.faq"></a></div></div>
<section class="sec alt" id="list"><div class="wrap"><details class="card" id="diff" style="margin-bottom:22px"><summary style="cursor:pointer;font-weight:800" data-i18n="diff.h"></summary><div class="cards c2" style="margin-top:14px;gap:18px"><div><h3 data-i18n="diff.ind.h"></h3><ul style="margin:8px 0 0;padding-left:20px"><li data-i18n="diff.ind.1"></li><li data-i18n="diff.ind.2"></li><li data-i18n="diff.ind.3"></li></ul></div><div><h3 data-i18n="diff.fam.h"></h3><ul style="margin:8px 0 0;padding-left:20px"><li data-i18n="diff.fam.1"></li><li data-i18n="diff.fam.2"></li><li data-i18n="diff.fam.3"></li></ul></div></div><p style="margin:14px 0 0;color:var(--mute)" data-i18n="diff.same"></p></details><div class="plans"><aside class="filters"><h4 data-i18n="filter.browse"></h4>
 <h4 data-i18n="filter.type"></h4><label><input type="checkbox" data-ft="individual" checked><span data-i18n="type.individual"></span></label><label><input type="checkbox" data-ft="family" checked><span data-i18n="type.family"></span></label></aside>
 <div><div class="plist" id="plist"></div><p id="pnone" style="display:none;color:var(--mute)" data-i18n="plan.none"></p><p style="font-size:.85rem;color:var(--mute);margin-top:18px" data-i18n="plans.note"></p><div class="card" style="margin-top:18px"><p style="margin:0 0 6px"><b data-i18n="plans.uw"></b></p><p style="margin:0;color:var(--mute);font-size:.9rem" data-i18n="plans.consent"></p></div></div></div></div></section>
<section class="sec white" id="compare"><div class="wrap"><h2 data-i18n="cmpt.h"></h2><div class="scroll"><table class="tbl" id="ctable"></table></div></div></section>
<div class="cmpbar" id="cmpbar"><div class="wrap"><b id="cmpn"></b><span data-i18n="cmpbar.t"></span><span id="cmpnames" style="opacity:.8"></span><a class="btn gold sm" style="margin-left:auto" href="#compare" data-i18n="cmpbar.go"></a><button class="btn outl-w sm" id="cmpclr" data-i18n="cmpbar.clear"></button></div></div>
</main><script src="/js/i18n.js"></script><script src="/js/i18n2.js"></script><script src="/js/i18n3.js"></script><script src="/js/i18n4.js"></script><script src="/js/i18n5.js"></script><script src="/js/icons.js"></script><script src="/js/app.js"></script><script src="/js/ui.js"></script><script src="/js/pwa.js"></script><script src="/js/appmode.js"></script><script>

function planCardHome(p){const lo=Math.round(p.base*.85),hi=Math.round(p.base*1.15);return '<div class="card plancard" data-type="'+p.type+'" style="display:flex;flex-direction:column"><div>'+(p.isNew?'<span class="chip">'+PC.t('plan.new')+'</span>':'')+'<span class="chip" style="background:var(--red-t);color:var(--red)">'+PC.t('type.'+p.type)+'</span></div><h3 style="margin-top:10px;font-size:1.35rem">'+PC.planName(p.id)+'</h3><ul style="padding-left:18px;margin:6px 0 14px;color:var(--mute)">'+covs(p).slice(0,3).map(c=>'<li>'+PC.t('cov.'+c)+'</li>').join('')+'<li>'+PC.t('plan.wear')+'</li></ul><div style="margin-top:auto;border-top:1px solid var(--line);padding-top:14px"><small style="color:var(--mute)">'+PC.t('plan.from')+'</small><div style="color:var(--red);font-size:1.35rem;font-weight:800;white-space:nowrap;margin-bottom:12px">RM '+PC.fmt(p.base,0)+'<small style="font-size:.8rem;font-weight:500;color:var(--mute)"> '+PC.t('common.year')+'</small></div><a class="btn sm ghost" style="width:100%" href="/plans#'+p.id+'">'+PC.t('common.learn')+' &rarr;</a></div></div>'}
function covs(p){return 'ABCDEF'.slice(0,{A:3,B:4,C:5,D:6}[p.id]||3).split('')}
let PL=[],sel=[];
const T=()=>[...document.querySelectorAll('[data-ft]:checked')].map(e=>e.dataset.ft);
function planCard(p){const lo=Math.round(p.base*.85),hi=Math.round(p.base*1.15);return '<div class="plan" id="'+p.id+'">'+(p.isNew?'<span class="rib">'+PC.t('plan.new')+'</span>':'')+'<div><span class="cat">'+PC.t('plan.cat')+'</span><h3>'+PC.planName(p.id)+'</h3><div><span class="chip">'+PC.t('type.'+p.type)+'</span>'+'</div><ul>'+covs(p).map(c=>'<li>'+PC.t('cov.'+c)+'</li>').join('')+'<li>'+PC.t('plan.wear')+'</li></ul><p style="margin:0;color:var(--mute);font-size:.9rem">'+PC.t('plan.cover')+' <b>RM '+PC.fmt(p.cover,0)+'</b></p></div><div class="side"><div class="price"><small>'+PC.t('plan.from')+'</small><b>RM '+PC.fmt(p.base,0)+'</b><small>'+PC.t('common.year')+'</small><br><small style="color:var(--mute)">'+PC.t('plan.range')+': RM '+PC.fmt(lo,0)+'–'+PC.fmt(hi,0)+'</small></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn ghost sm" data-cmp="'+p.id+'">'+(sel.includes(p.id)?'&#10003; '+PC.t('plan.added'):'+ '+PC.t('plan.compare'))+'</button><a class="btn ghost sm" href="/calculator?plan='+p.id+'">'+PC.t('plan.quote')+'</a><a class="btn sm" href="/apply?plan='+p.id+'">'+PC.t('plan.apply')+'</a></div></div></div>'}
function draw(){const t=T();const vis=PL.filter(p=>t.includes(p.type));document.getElementById('plist').innerHTML=vis.map(planCard).join('');document.getElementById('pnone').style.display=vis.length?'none':'';
 document.querySelectorAll('[data-cmp]').forEach(x=>x.onclick=()=>{const id=x.dataset.cmp;if(sel.includes(id))sel=sel.filter(s=>s!==id);else if(sel.length<3)sel.push(id);draw();table()});table()}
function table(){const rows=PL.filter(p=>sel.includes(p.id));const bar=document.getElementById('cmpbar');bar.classList.toggle('open',sel.length>0);cmpn.textContent=sel.length;cmpnames.textContent=sel.map(PC.planName).join(', ');
 const use=rows.length?rows:PL;const tb=document.getElementById('ctable');
 tb.innerHTML='<thead><tr><th></th>'+use.map(p=>'<th>'+PC.planName(p.id)+'</th>').join('')+'</tr></thead><tbody>'+
 [['cmpt.price',p=>'RM '+PC.fmt(p.base,0)],['cmpt.best',p=>'RM '+PC.fmt(p.base*.85,0)],['cmpt.worst',p=>'RM '+PC.fmt(p.base*1.15,0)],['cmpt.cover',p=>'RM '+PC.fmt(p.cover,0)],['cmpt.type',p=>PC.t('type.'+p.type)],['cmpt.cov',p=>covs(p).map(c=>'<div style="margin:0 0 12px;line-height:1.45">'+PC.t('cov.'+c)+'</div>').join('')]].map(r=>'<tr><td>'+PC.t(r[0])+'</td>'+use.map(p=>'<td>'+r[1](p)+'</td>').join('')+'</tr>').join('')+'<tr><td></td>'+use.map(p=>'<td><div style="display:flex;flex-direction:column;gap:6px"><a class="btn ghost sm" href="/calculator?plan='+p.id+'">'+PC.t('plan.quote')+'</a><a class="btn sm" href="/apply?plan='+p.id+'">'+PC.t('plan.apply')+'</a></div></td>').join('')+'</tr></tbody>'}
PC.api('/plans').then(p=>{PL=p;draw();if(location.hash&&document.querySelector(location.hash))setTimeout(()=>document.querySelector(location.hash).scrollIntoView({block:'center'}),100)});
document.querySelectorAll('[data-ft]').forEach(e=>e.onchange=draw);cmpclr.onclick=()=>{sel=[];draw()};
window.addEventListener('pc:lang',draw);</script></body></html>
