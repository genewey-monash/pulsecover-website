<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plans | PulseCover</title><meta name="description" content="Browse and compare PulseCover plans.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"></head><body>
<main>
<section class="sec" style="padding:48px 0 28px"><div class="wrap"><div class="cards c2" style="align-items:center"><div><h1 data-i18n="plans.h1"></h1><p class="lead" data-i18n="plans.sub"></p><div class="cta"><a class="btn" href="/calculator" data-i18n="plan.quote"></a><a class="btn ghost" href="#advisor" data-open-callback data-i18n="nav.talk"></a></div></div><div class="imgslot" style="min-height:240px">ILLUSTRATION/PHOTO: friendly flat illustration or photo of a person checking a smartwatch with a heart and shield icon. Landscape, min 900x600.</div></div></div></section>
<div class="subnav"><div class="wrap"><strong data-i18n="nav.plans"></strong><a href="#list" data-i18n="plans.all"></a><a href="#compare" data-i18n="cmpt.h"></a><a href="/how-pricing-works" data-i18n="nav.how"></a><a href="/faq" data-i18n="nav.faq"></a></div></div>
<section class="sec alt" id="list"><div class="wrap"><div class="plans"><aside class="filters"><h4 data-i18n="filter.browse"></h4>
 <h4 data-i18n="filter.type"></h4><label><input type="checkbox" data-ft="individual" checked><span data-i18n="type.individual"></span></label><label><input type="checkbox" data-ft="family" checked><span data-i18n="type.family"></span></label>
 <h4 data-i18n="filter.buy"></h4><label><input type="checkbox" data-fb="online" checked><span data-i18n="buy.online"></span></label><label><input type="checkbox" data-fb="advisor" checked><span data-i18n="buy.advisor"></span></label></aside>
 <div><div class="plist" id="plist"></div><p id="pnone" style="display:none;color:var(--mute)" data-i18n="plan.none"></p><p style="font-size:.85rem;color:var(--mute);margin-top:18px" data-i18n="plans.note"></p></div></div></div></section>
<section class="sec white" id="compare"><div class="wrap"><h2 data-i18n="cmpt.h"></h2><div class="scroll"><table class="tbl" id="ctable"></table></div></div></section>
<div class="cmpbar" id="cmpbar"><div class="wrap"><b id="cmpn"></b><span data-i18n="cmpbar.t"></span><span id="cmpnames" style="opacity:.8"></span><a class="btn gold sm" style="margin-left:auto" href="#compare" data-i18n="cmpbar.go"></a><button class="btn outl-w sm" id="cmpclr" data-i18n="cmpbar.clear"></button></div></div>
</main><script src="/js/i18n.js"></script><script src="/js/i18n2.js"></script><script src="/js/i18n3.js"></script><script src="/js/icons.js"></script><script src="/js/app.js"></script><script>

function planCardHome(p){const lo=Math.round(p.base*.85),hi=Math.round(p.base*1.15);return '<div class="card plancard" data-type="'+p.type+'" style="display:flex;flex-direction:column"><div>'+(p.isNew?'<span class="chip">'+PC.t('plan.new')+'</span>':'')+'<span class="chip" style="background:var(--red-t);color:var(--red)">'+PC.t('type.'+p.type)+'</span></div><h3 style="margin-top:10px;font-size:1.35rem">'+PC.planName(p.id)+'</h3><ul style="padding-left:18px;margin:6px 0 14px;color:var(--mute)">'+covs(p).slice(0,3).map(c=>'<li>'+PC.t('cov.'+c)+'</li>').join('')+'<li>'+PC.t('plan.wear')+'</li></ul><div style="margin-top:auto;border-top:1px solid var(--line);padding-top:14px"><small style="color:var(--mute)">'+PC.t('plan.from')+'</small><div style="color:var(--red);font-size:1.35rem;font-weight:800;white-space:nowrap;margin-bottom:12px">RM '+PC.fmt(p.base,0)+'<small style="font-size:.8rem;font-weight:500;color:var(--mute)"> '+PC.t('common.year')+'</small></div><a class="btn sm ghost" style="width:100%" href="/plans#'+p.id+'">'+PC.t('common.learn')+' &rarr;</a></div></div>'}
function covs(p){return 'ABCDEF'.slice(0,{A:3,B:4,C:5,D:6}[p.id]||3).split('')}
let PL=[],sel=[];
const T=()=>[...document.querySelectorAll('[data-ft]:checked')].map(e=>e.dataset.ft),B=()=>[...document.querySelectorAll('[data-fb]:checked')].map(e=>e.dataset.fb);
function planCard(p){const lo=Math.round(p.base*.85),hi=Math.round(p.base*1.15);return '<div class="plan" id="'+p.id+'">'+(p.isNew?'<span class="rib">'+PC.t('plan.new')+'</span>':'')+'<div><span class="cat">'+PC.t('plan.cat')+'</span><h3>'+PC.planName(p.id)+'</h3><div><span class="chip">'+PC.t('type.'+p.type)+'</span>'+p.buy.map(b=>'<span class="chip" style="background:var(--red-t);color:var(--red)">'+PC.t('buy.'+b)+'</span>').join('')+'</div><ul>'+covs(p).map(c=>'<li>'+PC.t('cov.'+c)+'</li>').join('')+'<li>'+PC.t('plan.wear')+'</li></ul><p style="margin:0;color:var(--mute);font-size:.9rem">'+PC.t('plan.cover')+' <b>RM '+PC.fmt(p.cover,0)+'</b></p></div><div class="side"><div class="price"><small>'+PC.t('plan.from')+'</small><b>RM '+PC.fmt(p.base,0)+'</b><small>'+PC.t('common.year')+'</small><br><small style="color:var(--mute)">'+PC.t('plan.range')+': RM '+PC.fmt(lo,0)+' - '+PC.fmt(hi,0)+'</small></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn ghost sm" data-cmp="'+p.id+'">'+(sel.includes(p.id)?'&#10003; '+PC.t('plan.added'):'+ '+PC.t('plan.compare'))+'</button><a class="btn ghost sm" href="/calculator?plan='+p.id+'">'+PC.t('plan.quote')+'</a><a class="btn sm" href="/apply?plan='+p.id+'">'+PC.t('plan.apply')+'</a></div></div></div>'}
function draw(){const t=T(),b=B();const vis=PL.filter(p=>t.includes(p.type)&&p.buy.some(x=>b.includes(x)));document.getElementById('plist').innerHTML=vis.map(planCard).join('');document.getElementById('pnone').style.display=vis.length?'none':'';
 document.querySelectorAll('[data-cmp]').forEach(x=>x.onclick=()=>{const id=x.dataset.cmp;if(sel.includes(id))sel=sel.filter(s=>s!==id);else if(sel.length<3)sel.push(id);draw();table()});table()}
function table(){const rows=PL.filter(p=>sel.includes(p.id));const bar=document.getElementById('cmpbar');bar.classList.toggle('open',sel.length>0);cmpn.textContent=sel.length;cmpnames.textContent=sel.map(PC.planName).join(', ');
 const use=rows.length?rows:PL;const tb=document.getElementById('ctable');
 tb.innerHTML='<thead><tr><th></th>'+use.map(p=>'<th>'+PC.planName(p.id)+'</th>').join('')+'</tr></thead><tbody>'+
 [['cmpt.price',p=>'RM '+PC.fmt(p.base,0)],['cmpt.best',p=>'RM '+PC.fmt(p.base*.85,0)],['cmpt.worst',p=>'RM '+PC.fmt(p.base*1.15,0)],['cmpt.cover',p=>'RM '+PC.fmt(p.cover,0)],['cmpt.type',p=>PC.t('type.'+p.type)],['cmpt.buy',p=>p.buy.map(b=>PC.t('buy.'+b)).join(', ')],['cmpt.cov',p=>covs(p).map(c=>PC.t('cov.'+c)).join('<br>')]].map(r=>'<tr><td>'+PC.t(r[0])+'</td>'+use.map(p=>'<td>'+r[1](p)+'</td>').join('')+'</tr>').join('')+'</tbody>'}
PC.api('/plans').then(p=>{PL=p;draw();if(location.hash&&document.querySelector(location.hash))setTimeout(()=>document.querySelector(location.hash).scrollIntoView({block:'center'}),100)});
document.querySelectorAll('[data-ft],[data-fb]').forEach(e=>e.onchange=draw);cmpclr.onclick=()=>{sel=[];draw()};
window.addEventListener('pc:lang',draw);</script></body></html>
