<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>For business | PulseCover</title><meta name="description" content="Group wearable-linked health and life benefit for SMEs.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<script>(function(){try{var th=localStorage.getItem('pc_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=th}catch(e){document.documentElement.dataset.theme='light'}})()</script><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#B71234"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PulseCover"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png"><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/appmode.css"><script>(function(){var d=document.documentElement,m=function(){var on=false;try{on=matchMedia('(max-width:820px)').matches||(matchMedia('(display-mode: standalone)').matches&&matchMedia('(pointer:coarse)').matches)||(navigator.standalone===true)}catch(e){}d.classList.toggle('appmode',on)};m();addEventListener('resize',m);try{if(location.pathname==='/'&&!/[?&]site=1/.test(location.search)&&matchMedia('(max-width:820px)').matches&&matchMedia('(pointer:coarse)').matches&&!sessionStorage.getItem('pc_site')){location.replace('/m/')}else if(/[?&]site=1/.test(location.search)){sessionStorage.setItem('pc_site','1')}}catch(e){}})()</script></head><body>
<main><section class="sec"><div class="wrap"><h1 data-i18n="sme.h1"></h1><p class="lead" data-i18n="sme.sub"></p><img class="photo banner" src="/img/team-meeting.jpg" alt="Three colleagues of different ages in a friendly discussion at a meeting table" width="1376" height="768" loading="lazy">
<div class="cards c3" style="margin:28px 0"><div class="card"><div class="ico">1</div><h3 data-i18n="sme.b1.h"></h3><p data-i18n="sme.b1.p"></p></div><div class="card"><div class="ico">2</div><h3 data-i18n="sme.b2.h"></h3><p data-i18n="sme.b2.p"></p></div><div class="card"><div class="ico">3</div><h3 data-i18n="sme.b3.h"></h3><p data-i18n="sme.b3.p"></p></div></div>
<div class="calc"><div class="card"><h3 data-i18n="sme.calc.h"></h3><div class="rng"><label data-i18n="sme.employees"></label><b id="ve"></b></div><input type="range" id="emp" min="1" max="500" value="25">
<div class="rng"><label data-i18n="sme.avg"></label><b id="va"></b></div><input type="range" id="avg" min="0" max="100" value="60"></div>
<div class="result"><div class="row"><span data-i18n="sme.per"></span><b id="s_per"></b></div><div class="row"><span data-i18n="sme.total"></span><b id="s_tot" style="font-size:1.4rem"></b></div><div class="row"><span data-i18n="calc.adj"></span><b id="s_adj"></b></div><div class="row"><span data-i18n="sme.bulk"></span><b id="s_bulk"></b></div><div class="row" style="border:0"><span data-i18n="sme.save"></span><b id="s_sav"></b></div></div></div>
<div class="card" id="enquiry" style="margin-top:24px;max-width:720px"><h3 data-i18n="sme.enquiry.h"></h3><form id="ef"><div class="rowf"><div><label data-i18n="sme.company"></label><input id="e_co" required></div><div><label data-i18n="sme.contact"></label><input id="e_ct" required></div><div><label data-i18n="field.email"></label><input id="e_em" type="email" required></div><div><label data-i18n="field.phone"></label><input id="e_ph"></div></div><label data-i18n="field.message"></label><textarea id="e_ms" rows="3"></textarea><div class="msg" id="em"></div><button class="btn" style="margin-top:14px" data-i18n="sme.send"></button></form><p style="margin-top:16px;color:var(--mute);font-size:.9rem" data-i18n="sme.assoc"></p></div></div></section></main><script src="/js/i18n.js"></script><script src="/js/i18n2.js"></script><script src="/js/i18n3.js"></script><script src="/js/i18n4.js"></script><script src="/js/i18n5.js"></script><script src="/js/i18n6.js"></script><script src="/js/icons.js"></script><script src="/js/app.js"></script><script src="/js/ui.js"></script><script src="/js/pwa.js"></script><script src="/js/appmode.js"></script><script>
let q,t;function paint(){if(!q)return;s_per.textContent='RM '+PC.fmt(q.perEmployeeAnnual);s_tot.textContent='RM '+PC.fmt(q.totalAnnual);s_adj.textContent=(q.adjustmentPct>0?'+':'')+q.adjustmentPct+'%';s_bulk.textContent=q.bulkDiscountPct+'%';s_sav.textContent='RM '+PC.fmt(q.savingsVsFlat)}
async function run(){ve.textContent=emp.value;va.textContent=avg.value;try{q=await PC.api('/sme/quote',{employees:+emp.value,avgScore:+avg.value});paint()}catch(e){}}
[emp,avg].forEach(e=>e.oninput=()=>{ve.textContent=emp.value;va.textContent=avg.value;clearTimeout(t);t=setTimeout(run,120)});run();window.addEventListener('pc:lang',paint);
ef.onsubmit=async e=>{e.preventDefault();try{await PC.api('/sme/enquiry',{company:e_co.value,contact:e_ct.value,email:e_em.value,phone:e_ph.value,employees:+emp.value,avgScore:+avg.value,message:e_ms.value,lang:PC.lang});PC.thanks('sme',{name:e_ct.value,email:e_em.value})}catch(x){PC.msg(em,x.message)}}</script></body></html>
