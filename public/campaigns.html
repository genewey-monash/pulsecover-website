<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campaigns | PulseCover</title><meta name="description" content="Optional challenges and offers from our partners.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<script>(function(){try{var th=localStorage.getItem('pc_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=th}catch(e){document.documentElement.dataset.theme='light'}})()</script><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#B71234"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PulseCover"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png"><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/appmode.css"><script>(function(){var d=document.documentElement,m=function(){var on=false;try{on=matchMedia('(max-width:820px)').matches||(matchMedia('(display-mode: standalone)').matches&&matchMedia('(pointer:coarse)').matches)||(navigator.standalone===true)}catch(e){}d.classList.toggle('appmode',on)};m();addEventListener('resize',m);try{if(location.pathname==='/'&&!/[?&]site=1/.test(location.search)&&matchMedia('(max-width:820px)').matches&&matchMedia('(pointer:coarse)').matches&&!sessionStorage.getItem('pc_site')){location.replace('/m/')}else if(/[?&]site=1/.test(location.search)){sessionStorage.setItem('pc_site','1')}}catch(e){}})()</script></head><body>
<main><section class="sec"><div class="wrap" style="max-width:980px">
 <span class="kicker" data-i18n="nav.campaigns"></span><h1 data-i18n="cm.h1"></h1><p class="lead" data-i18n="cm.sub"></p>
 <div class="cards c2" id="cmlist" style="margin-top:18px"></div>
 <p class="fnote" style="margin-top:20px" data-i18n="cm.privacy"></p><p class="fnote" data-i18n="rw.demo"></p>
</div></section></main><script src="/js/i18n.js"></script><script src="/js/i18n2.js"></script><script src="/js/i18n3.js"></script><script src="/js/i18n4.js"></script><script src="/js/i18n5.js"></script><script src="/js/i18n6.js"></script><script src="/js/i18n7.js"></script><script src="/js/i18n8.js"></script><script src="/js/icons.js"></script><script src="/js/app.js"></script><script src="/js/ui.js"></script><script src="/js/pwa.js"></script><script src="/js/appmode.js"></script><script>
let L=[];
const KIND={insurer:'cm.insurer',brand:'cm.brand',watch:'cm.watch'};
function draw(){ const t=PC.t;
 document.getElementById('cmlist').innerHTML=L.map(c=>{
  const prog=c.joined&&c.target?'<div style="margin-top:10px"><small style="color:var(--mute)">'+c.progress+' / '+c.target+' '+t('cm.progress')+'</small><div style="height:8px;border-radius:5px;background:var(--line);margin-top:6px;overflow:hidden"><div style="height:100%;width:'+Math.max(4,c.progress/c.target*100)+'%;background:var(--red)"></div></div></div>':'';
  let act;
  if(c.kind==='watch') act='<span class="chip">'+t('cm.soon')+'</span>';
  else if(!PC.user) act='<a class="btn sm" href="/account?next=/campaigns">'+t('cm.login')+'</a>';
  else if(c.completed) act='<span class="chip" style="background:var(--red);color:#fff">&#10003; '+t('cm.done')+'</span>';
  else if(c.joined) act='<span class="chip">'+t('cm.joined')+'</span> <button class="btn ghost sm" data-leave="'+c.id+'">'+t('cm.leave')+'</button>';
  else act='<button class="btn sm" data-join="'+c.id+'">'+t('cm.join')+'</button>';
  return '<div class="card"><span class="chip" style="background:var(--red-t);color:var(--ink);font-weight:700">'+t(KIND[c.kind])+'</span><h3 style="margin:10px 0 6px">'+t('cm.'+c.id+'.h')+'</h3><p style="margin:0;color:var(--mute)">'+t('cm.'+c.id+'.p')+'</p>'+prog+'<div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+act+'</div></div>'}).join('');
 document.querySelectorAll('[data-join]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{L=(await PC.api('/campaigns/join',{id:b.dataset.join})).campaigns}catch(e){}draw()});
 document.querySelectorAll('[data-leave]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{L=(await PC.api('/campaigns/leave',{id:b.dataset.leave})).campaigns}catch(e){}draw()});
}
PC.ready.then(async()=>{try{L=await PC.api('/campaigns')}catch(e){}draw()});
window.addEventListener('pc:lang',draw);</script></body></html>
