<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect your wearable | PulseCover</title><meta name="description" content="Connect Fitbit, Garmin, Whoop or Google Health Connect to get your PulseCover Risk Rating.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<script>(function(){try{var th=localStorage.getItem('pc_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=th}catch(e){document.documentElement.dataset.theme='light'}})()</script><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="stylesheet" href="/css/style.css"></head><body>
<main>
<section class="sec" style="padding:48px 0 24px"><div class="wrap"><div class="cards c2" style="align-items:center;gap:40px"><div><span class="kicker" data-i18n="nav.connect"></span><h1 data-i18n="connect.h1"></h1><p class="lead" data-i18n="connect.sub"></p>
<div class="devrow" id="devrow"></div><div id="cres"></div><div class="msg" id="cmsg"></div></div>
<img class="photo" src="/img/connect-wrist.jpg" alt="A wrist wearing a plain smartwatch beside a phone showing a ring graphic" width="1200" height="896"></div></div></section>
<section class="sec alt"><div class="wrap"><div class="cards c3"><div class="card"><div class="ico">1</div><h3 data-i18n="connect.s1"></h3></div><div class="card"><div class="ico">2</div><h3 data-i18n="connect.s2"></h3></div><div class="card"><div class="ico">3</div><h3 data-i18n="connect.s3"></h3></div></div></div></section>
<section class="sec white"><div class="wrap"><div class="cards c2"><div class="card"><h3 data-i18n="connect.allow.h"></h3><ul class="perm"><li data-i18n="connect.a1"></li><li data-i18n="connect.a2"></li><li data-i18n="connect.a3"></li><li data-i18n="connect.a4"></li></ul></div><div class="card"><h3 data-i18n="connect.never.h"></h3><ul class="perm no"><li data-i18n="connect.n1"></li><li data-i18n="connect.n2"></li><li data-i18n="connect.n3"></li></ul></div></div>
<div class="card" style="margin-top:20px"><p data-i18n="connect.hc"></p></div><p style="margin-top:16px;color:var(--mute);font-size:.88rem" data-i18n="connect.demo"></p></div></section>
<section class="sec"><div class="wrap center"><h2 data-i18n="flow.h"></h2><div class="flow"><div class="fnode"><div class="ico" data-ic="watch"></div><h3 data-i18n="flow.1.h"></h3><p data-i18n="flow.1.p"></p></div><div class="farrow"><svg viewBox="0 0 46 24" width="46" height="24"><path d="M2 12h38M31 4l9 8-9 8" fill="none" stroke="#B71234" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="fnode mid"><video class="logoanim" src="/img/logo-animated.mp4" autoplay muted loop playsinline preload="metadata" aria-label="PulseCover logo animation"></video><h3 data-i18n="flow.2.h"></h3><p data-i18n="flow.2.p"></p></div><div class="farrow"><svg viewBox="0 0 46 24" width="46" height="24"><path d="M2 12h38M31 4l9 8-9 8" fill="none" stroke="#B71234" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="fnode"><div class="ico" data-ic="shield"></div><h3 data-i18n="flow.3.h"></h3><p data-i18n="flow.3.p"></p></div></div><p class="center" style="color:var(--mute);max-width:640px;margin:14px auto 0" data-i18n="flow.note"></p></div></section>
</main><script src="/js/i18n.js"></script><script src="/js/i18n2.js"></script><script src="/js/i18n3.js"></script><script src="/js/i18n4.js"></script><script src="/js/i18n5.js"></script><script src="/js/icons.js"></script><script src="/js/app.js"></script><script src="/js/ui.js"></script><script>
function ics(){document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=PC_ICON(e.dataset.ic))}ics();
let conn=[];
function row(){document.getElementById('devrow').innerHTML=Object.entries(PC.providers).map(([k,n])=>'<button class="devbtn'+(conn.includes(k)?' on':'')+'" data-p="'+k+'">'+n+'<small>'+(conn.includes(k)?PC.t('connect.connected'):PC.t('connect.cta'))+'</small></button>').join('');
 document.querySelectorAll('.devbtn').forEach(b=>b.onclick=async()=>{try{const r=await PC.connect(b.dataset.p);if(!conn.includes(b.dataset.p))conn.push(b.dataset.p);row();show(r)}catch(e){if(e.message!=='cancel')PC.msg(cmsg,e.message)}})}
function show(r){const q=r.quote;document.getElementById('cres').innerHTML='<div class="card" style="margin-top:8px"><p style="margin:0 0 6px"><b>&#10003; '+PC.t('connect.connected')+' &middot; '+r.days+' '+PC.t('apply.connected.n')+'</b></p><p style="margin:0 0 10px">'+PC.t('rate.h')+': <span class="gr '+(q.grade==='A+'?'Ap':q.grade)+'">'+q.grade+'</span> &middot; '+PC.t('rate.score')+' '+q.score+'/100</p><a class="btn sm" href="/apply">'+PC.t('plan.apply')+' &rarr;</a></div>'}
PC.ready.then(async()=>{if(!PC.user){document.getElementById('devrow').style.display='block';document.getElementById('devrow').innerHTML='<p style="width:100%;color:var(--mute)">'+PC.t('connect.login')+'</p><a class="btn" href="/account?next=/connect">'+PC.t('nav.login')+'</a>';return}
 try{const d=await PC.api('/dashboard');conn=d.connections.map(c=>c.provider)}catch(e){}row()});
window.addEventListener('pc:lang',()=>{if(PC.user)row()});</script></body></html>
