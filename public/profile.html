<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My profile | PulseCover</title><meta name="description" content="Update your personal details, current plan and password.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<script>(function(){try{var th=localStorage.getItem('pc_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=th}catch(e){document.documentElement.dataset.theme='light'}})()</script><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="stylesheet" href="/css/style.css"></head><body>
<main><section class="sec"><div class="wrap"><h1 data-i18n="pf.h1"></h1><p class="lead" data-i18n="pf.sub"></p>
<div class="pgrid">
 <div class="card" id="pcard"><h3 data-i18n="pf.personal"></h3><form id="pf" novalidate>
  <label data-i18n="field.name" for="p_n"></label><input id="p_n" maxlength="100" autocomplete="name"><p class="fhelp" id="p_n_e"></p>
  <label data-i18n="field.email" for="p_e"></label><input id="p_e" type="email" disabled><p class="fnote" data-i18n="pf.email.note"></p>
  <div class="rowf"><div><label data-i18n="field.phone" for="p_p"></label><input id="p_p" type="tel" maxlength="20" autocomplete="tel" inputmode="tel"><p class="fhelp" id="p_p_e"></p></div>
  <div><label data-i18n="field.dob" for="p_d"></label><input id="p_d" type="date"><p class="fhelp" id="p_d_e"></p></div></div>
  <label data-i18n="pf.address" for="p_a"></label><input id="p_a" maxlength="200" autocomplete="street-address">
  <label data-i18n="pf.lang" for="p_l"></label><select id="p_l"><option value="en">English</option><option value="zh">中文</option><option value="ms">Bahasa Malaysia</option><option value="ta">தமிழ்</option></select>
  <div class="msg" id="pm1"></div><button class="btn" style="margin-top:20px" data-i18n="pf.save"></button></form></div>
 <div>
  <div class="card" id="plcard"><h3 data-i18n="pf.plan.h"></h3>
   <div id="nopol" class="emptyrow" style="display:none"><p data-i18n="pf.plan.none"></p><a class="btn" href="/apply" data-i18n="nav.apply"></a></div>
   <div id="haspol" style="display:none">
    <dl class="kv"><div><dt data-i18n="pf.policyno"></dt><dd id="v_no"></dd></div><div><dt data-i18n="pf.cover"></dt><dd id="v_cov"></dd></div><div><dt data-i18n="pf.prem"></dt><dd id="v_prem"></dd></div><div><dt data-i18n="pf.renew"></dt><dd id="v_ren"></dd></div></dl>
    <h4 style="margin:22px 0 12px" data-i18n="pf.choose"></h4><div class="plansel" id="psel"></div>
    <label data-i18n="pf.ben" for="p_b"></label><input id="p_b" maxlength="100"><p class="fhelp" id="p_b_e"></p>
    <p class="fnote" data-i18n="pf.plan.note"></p>
    <div class="msg" id="pm2"></div><button class="btn" id="psave" style="margin-top:16px" data-i18n="pf.plan.save"></button></div></div>
  <div class="card" style="margin-top:24px"><h3 data-i18n="pf.pw.h"></h3><form id="pwf" novalidate>
   <label data-i18n="pf.pw.cur" for="w_c"></label><div class="pwwrap"><input type="password" id="w_c" autocomplete="current-password"><button type="button" class="pwtog" data-for="w_c" data-i18n="acc.show"></button></div><p class="fhelp" id="w_c_e"></p><label data-i18n="pf.pw.new" for="w_n"></label><div class="pwwrap"><input type="password" id="w_n" autocomplete="new-password"><button type="button" class="pwtog" data-for="w_n" data-i18n="acc.show"></button></div><p class="fhelp" id="w_n_e"></p><label data-i18n="field.password2" for="w_n2"></label><div class="pwwrap"><input type="password" id="w_n2" autocomplete="new-password"><button type="button" class="pwtog" data-for="w_n2" data-i18n="acc.show"></button></div><p class="fhelp" id="w_n2_e"></p>
   <div class="msg" id="pm3"></div><button class="btn" style="margin-top:20px" data-i18n="pf.pw.btn"></button></form></div>
  <div class="card" style="margin-top:24px"><h3 data-i18n="pf.session.h"></h3><p class="sesmail"><span data-i18n="pf.session"></span> <b id="ses_em"></b></p><p class="fnote" data-i18n="pf.idle"></p><button class="btn ghost" id="pf_out" style="margin-top:18px" data-i18n="nav.logout"></button></div>
 </div></div></div></section></main><script src="/js/i18n.js"></script><script src="/js/i18n2.js"></script><script src="/js/i18n3.js"></script><script src="/js/i18n4.js"></script><script src="/js/i18n5.js"></script><script src="/js/icons.js"></script><script src="/js/app.js"></script><script src="/js/ui.js"></script><script>
let U,POL,PREV=[],plan='A';
function bad(id,key){const i=document.getElementById(id),h=document.getElementById(id+'_e');if(key){i.classList.add('fld-err');h.textContent=PC.t(key);h.classList.add('on')}else{i.classList.remove('fld-err');h.classList.remove('on')}return !key}
const age=d=>{const t=new Date(),b=new Date(d);if(isNaN(b))return -1;let a=t.getFullYear()-b.getFullYear();const m=t.getMonth()-b.getMonth();if(m<0||(m===0&&t.getDate()<b.getDate()))a--;return a};
document.querySelectorAll('.pwtog').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.for);const s=i.type==='password';i.type=s?'text':'password';b.textContent=PC.t(s?'acc.hide':'acc.show')});
window.addEventListener('pc:lang',()=>{document.querySelectorAll('.pwtog').forEach(b=>b.textContent=PC.t(document.getElementById(b.dataset.for).type==='password'?'acc.show':'acc.hide'));drawPlans();drawPolicy()});
p_d.max=new Date().toISOString().slice(0,10);
pf_out.onclick=()=>PC.logout();
function fillUser(){ses_em.textContent=U.email;p_n.value=U.name;p_e.value=U.email;p_p.value=U.phone||'';p_d.value=U.dob||'';p_a.value=U.address||'';p_l.value=U.lang||'en'}
function drawPolicy(){if(!U)return;const has=!!POL;nopol.style.display=has?'none':'';haspol.style.display=has?'':'none';if(!has)return;
 v_no.textContent=POL.number;v_cov.textContent='RM '+PC.fmt(POL.cover,0);v_prem.textContent='RM '+PC.fmt(POL.premium)+PC.t('common.year');v_ren.textContent=POL.renewal_date;if(document.activeElement!==p_b)p_b.value=POL.beneficiary||''}
function drawPlans(){if(!POL||!PREV.length)return;psel.innerHTML=PREV.map(p=>'<button type="button" class="pchoice '+(p.id===plan?'sel':'')+'" data-p="'+p.id+'" aria-pressed="'+(p.id===plan)+'"><b>'+PC.planName(p.id)+'</b><span>RM '+PC.fmt(p.premium,0)+PC.t('common.year')+'</span><small>'+PC.t('pf.cover')+' RM '+PC.fmt(p.cover,0)+'</small>'+(p.id===POL.plan?'<em>'+PC.t('pf.current')+'</em>':'')+'</button>').join('');
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{plan=b.dataset.p;drawPlans()})}
async function load(){try{const d=await PC.api('/dashboard');U=d.user;POL=d.policy;if(POL)plan=POL.plan||'A';fillUser();if(POL)PREV=await PC.api('/policy/preview',{});drawPolicy();drawPlans()}catch(e){if(e.status===401)location.href='/account?next=/profile'}}
PC.ready.then(load);
p_n.onblur=()=>bad('p_n',p_n.value.trim().length>=2?null:'acc.err.name');
pf.onsubmit=async e=>{e.preventDefault();pm1.className='msg';
 const ok=[bad('p_n',p_n.value.trim().length>=2?null:'acc.err.name'),bad('p_p',!p_p.value.trim()||/^\+?[0-9][0-9 \-]{6,18}$/.test(p_p.value.trim())?null:'pf.err.phone'),bad('p_d',p_d.value&&age(p_d.value)>=16?null:'acc.err.dob')].every(Boolean);
 if(!ok){const f=document.querySelector('#pf .fld-err');if(f)f.focus();PC.msg(pm1,PC.t('pf.fix'));return}
 try{U=await PC.api('/profile',{name:p_n.value.trim(),phone:p_p.value.trim(),dob:p_d.value,address:p_a.value.trim(),lang:p_l.value});PC.msg(pm1,PC.t('pf.saved'),true);if(U.lang!==PC.lang)PC.setLang(U.lang);PC.user=U;window.dispatchEvent(new CustomEvent('pc:lang',{detail:PC.lang}))}
 catch(x){PC.msg(pm1,/phone/i.test(x.message)?PC.t('pf.err.phone'):/at least 16/i.test(x.message)?PC.t('acc.err.dob'):x.message)}};
psave.onclick=async()=>{pm2.className='msg';if(!bad('p_b',p_b.value.trim().length>=2?null:'common.required'))return;psave.disabled=true;
 try{const r=await PC.api('/policy',{plan,beneficiary:p_b.value.trim()});POL=r.policy;PREV=await PC.api('/policy/preview',{});drawPolicy();drawPlans();PC.msg(pm2,PC.t('pf.plan.done'),true)}catch(x){PC.msg(pm2,x.message)}psave.disabled=false};
w_n2.oninput=()=>bad('w_n2',w_n.value===w_n2.value?null:'acc.err.match');w_n.onblur=()=>w_n.value&&bad('w_n',w_n.value.length>=8?null:'acc.err.pwlen');
pwf.onsubmit=async e=>{e.preventDefault();pm3.className='msg';
 const ok=[bad('w_c',w_c.value?null:'common.required'),bad('w_n',w_n.value.length>=8?null:'acc.err.pwlen'),bad('w_n2',w_n.value===w_n2.value?null:'acc.err.match')].every(Boolean);
 if(!ok){const f=document.querySelector('#pwf .fld-err');if(f)f.focus();PC.msg(pm3,PC.t('pf.fix'));return}
 try{await PC.api('/password',{current:w_c.value,password:w_n.value,password2:w_n2.value});PC.msg(pm3,PC.t('pf.pw.done'),true);pwf.reset()}
 catch(x){if(/incorrect/i.test(x.message)){bad('w_c','pf.pw.wrong');PC.msg(pm3,PC.t('pf.pw.wrong'))}else PC.msg(pm3,/do not match/i.test(x.message)?PC.t('acc.err.match'):x.message)}};</script></body></html>
