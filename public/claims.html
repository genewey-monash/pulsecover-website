<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claims | PulseCover</title><meta name="description" content="File and track a claim online.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/img/favicon.png"><link rel="stylesheet" href="/css/style.css"></head><body>
<main><section class="sec"><div class="wrap" style="max-width:860px"><h1 data-i18n="cl.h1"></h1><p class="lead" data-i18n="cl.sub"></p>
<div id="need" class="card" style="display:none"><p data-i18n="cl.need"></p><a class="btn" href="/apply" data-i18n="nav.apply"></a></div>
<div id="gate" class="card" style="display:none"><p data-i18n="apply.login.first"></p><a class="btn" href="/account?next=/claims" data-i18n="nav.login"></a></div>
<div class="card" id="form" style="display:none"><label data-i18n="cl.type"></label><select id="c_type"><option value="hospitalisation" data-i18n-opt="cl.t.hospitalisation"></option><option value="outpatient" data-i18n-opt="cl.t.outpatient"></option><option value="critical_illness" data-i18n-opt="cl.t.critical_illness"></option><option value="accident" data-i18n-opt="cl.t.accident"></option><option value="death" data-i18n-opt="cl.t.death"></option></select>
<div class="rowf"><div><label data-i18n="cl.amount"></label><input type="number" id="c_amt" min="1" step="0.01"></div><div><label data-i18n="cl.date"></label><input type="date" id="c_date"></div></div>
<label data-i18n="cl.desc"></label><textarea id="c_desc" rows="4" maxlength="2000"></textarea><div class="msg" id="cm"></div><button class="btn" style="margin-top:14px" id="csub" data-i18n="cl.submit"></button></div>
<h2 style="margin-top:36px" data-i18n="cl.track"></h2><div id="list"></div></div></section></main><script src="/js/i18n.js"></script><script src="/js/i18n2.js"></script><script src="/js/i18n3.js"></script><script src="/js/icons.js"></script><script src="/js/app.js"></script><script>
let claims=[];
const SEQ=['received','review','approved','paid'];
function paint(){const l=document.getElementById('list');if(!PC.user)return;l.innerHTML=claims.length?claims.map(c=>'<div class="card" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><b>'+PC.esc(c.number)+' &middot; '+PC.t('cl.t.'+c.type)+'</b><span class="pill">'+PC.t('cl.s.'+c.status)+'</span></div><p style="margin:6px 0">RM '+PC.fmt(c.amount)+' &middot; '+PC.esc(c.incident_date)+'</p><ul class="tl">'+c.events.map(e=>'<li>'+PC.t('cl.s.'+e.status)+' &middot; '+e.created.slice(0,16).replace('T',' ')+'</li>').join('')+'</ul></div>').join(''):'<p style="color:var(--mute)">'+PC.t('cl.none')+'</p>'}
async function load(){try{claims=await PC.api('/claims');paint()}catch(e){}}
PC.ready.then(async()=>{if(!PC.user){gate.style.display='';return}c_date.max=new Date().toISOString().slice(0,10);
 try{const d=await PC.api('/dashboard');if(!d.policy){need.style.display='';return}}catch(e){}form.style.display='';load()});
window.addEventListener('pc:lang',paint);
csub.onclick=async()=>{csub.disabled=true;try{const r=await PC.api('/claims',{type:c_type.value,amount:+c_amt.value,incidentDate:c_date.value,description:c_desc.value});PC.msg(cm,PC.t('cl.done')+' '+r.number,true);c_amt.value='';c_desc.value='';load()}catch(e){PC.msg(cm,e.message)}csub.disabled=false};</script></body></html>
